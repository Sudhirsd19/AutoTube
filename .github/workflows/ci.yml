name: AutoTube CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Syntax check
        run: python -m compileall -q autotube tests
      - name: Ruff (changed video pipeline files)
        run: >-
          ruff check
          autotube/media/nasa_media.py
          autotube/media/visual_quality_gate.py
          autotube/media/multi_stock_aggregator.py
          autotube/media/archival_fetcher.py
          autotube/media/director_engine.py
          autotube/video/shorts_builder.py
          autotube/voice/tts_engine.py
          autotube/web/app.py
          tests/test_scene_visual_sync.py
          tests/test_nasa_and_frame_qa.py
      - name: Tests
        run: pytest -q
