name: AutoTube CI

on:
  push:
    branches:
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Syntax check
        run: python -m compileall -q autotube tests
      - name: Ruff (subject-aware voice code)
        run: >-
          ruff check
          autotube/voice/voice_director.py
          tests/test_subject_aware_voice.py
      - name: Tests
        run: python -m pytest -q
