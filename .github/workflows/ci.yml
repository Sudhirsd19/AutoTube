name: AutoTube CI

on:
  push:
    branches:
      - master
      - "feat/**"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Syntax check
        run: python -m compileall -q autotube tests
      - name: Ruff
        run: ruff check autotube tests
      - name: Tests
        run: pytest -q
